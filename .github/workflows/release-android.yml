name: Release EVA Canteen Android APKs (v8a, v7a, Universal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to use v<version> from pubspec.yaml, e.g. v2.0.0)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build v8a, v7a & Universal APKs and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app version and release tag
        id: meta
        shell: bash
        run: |
          FULL_VERSION=$(grep -E '^version:' flutter_app/pubspec.yaml | head -n1 | awk '{print $2}' | tr -d '\r')
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION#*+}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION_NAME}"
          fi

          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=${TAG} (pubspec version=${FULL_VERSION})"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies, analyze & test
        working-directory: flutter_app
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test

      - name: Decode google-services.json (if configured)
        id: fcm
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > flutter_app/android/app/google-services.json
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Decoded flutter_app/android/app/google-services.json from secret (FCM enabled)."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_SERVICES_JSON_B64 not set; building without google-services.json."
          fi

      - name: Build Split APKs (arm64-v8a & armeabi-v7a)
        working-directory: flutter_app
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          mkdir -p ../release_assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../release_assets/EVA-Canteen-${{ steps.meta.outputs.tag }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../release_assets/EVA-Canteen-${{ steps.meta.outputs.tag }}-armeabi-v7a.apk"

      - name: Build Universal APK (all ABIs)
        working-directory: flutter_app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "../release_assets/EVA-Canteen-${{ steps.meta.outputs.tag }}-universal.apk"

      - name: Generate SHA-256 Checksums & Build Summary
        id: sizes
        shell: bash
        run: |
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

          V8A_SIZE=$(du -h "EVA-Canteen-${{ steps.meta.outputs.tag }}-arm64-v8a.apk" | awk '{print $1}')
          V7A_SIZE=$(du -h "EVA-Canteen-${{ steps.meta.outputs.tag }}-armeabi-v7a.apk" | awk '{print $1}')
          UNI_SIZE=$(du -h "EVA-Canteen-${{ steps.meta.outputs.tag }}-universal.apk" | awk '{print $1}')
          echo "v8a=${V8A_SIZE}" >> "$GITHUB_OUTPUT"
          echo "v7a=${V7A_SIZE}" >> "$GITHUB_OUTPUT"
          echo "universal=${UNI_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVA-Canteen-${{ steps.meta.outputs.tag }}-APKs
          path: release_assets/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          FULL_VERSION: ${{ steps.meta.outputs.full_version }}
          FCM_ENABLED: ${{ steps.fcm.outputs.enabled }}
          V8A_SIZE: ${{ steps.sizes.outputs.v8a }}
          V7A_SIZE: ${{ steps.sizes.outputs.v7a }}
          UNI_SIZE: ${{ steps.sizes.outputs.universal }}
          IS_PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          if [ "$FCM_ENABLED" = "true" ]; then
            FCM_BADGE="Enabled (Firebase Cloud Messaging bundled)"
          else
            FCM_BADGE="Disabled (GOOGLE_SERVICES_JSON_B64 secret not configured)"
          fi

          cat <<EOF > release_notes.md
          ## EVA Canteen ${TAG} (\`${FULL_VERSION}\`)

          ### Download Android APK

          | Variant | File | Size | Best For |
          | :--- | :--- | :---: | :--- |
          | **ARM64 (Recommended)** | \`EVA-Canteen-${TAG}-arm64-v8a.apk\` | ${V8A_SIZE} | Modern 64-bit Android phones (smallest & fastest) |
          | **ARM32** | \`EVA-Canteen-${TAG}-armeabi-v7a.apk\` | ${V7A_SIZE} | Older 32-bit Android devices |
          | **Universal** | \`EVA-Canteen-${TAG}-universal.apk\` | ${UNI_SIZE} | Any Android device (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) |

          - **Build:** \`${FULL_VERSION}\` (\`${GITHUB_SHA::7}\`)
          - **Push Notifications (FCM):** ${FCM_BADGE}
          - **Checksums:** Included in \`SHA256SUMS.txt\`
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG}..."
            gh release upload "${TAG}" release_assets/* --clobber
            gh release edit "${TAG}" --title "EVA Canteen ${TAG}" --notes-file release_notes.md
          else
            echo "Creating new release ${TAG}..."
            PRERELEASE_FLAG=""
            if [ "${IS_PRERELEASE}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "${TAG}" release_assets/* \
              --target "${GITHUB_SHA}" \
              --title "EVA Canteen ${TAG}" \
              --notes-file release_notes.md \
              ${PRERELEASE_FLAG}
          fi
