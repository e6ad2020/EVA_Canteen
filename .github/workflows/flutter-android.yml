name: Build EVA Canteen Flutter Android (arm64-v8a) & Web

on:
  push:
    branches:
      - flutter-v2
      - main
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies, analyze & test
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android arm64-v8a Release APK
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload arm64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVA-Canteen-arm64-v8a-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
