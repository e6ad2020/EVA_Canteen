<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EVA Canteen — Bilingual Digital Ordering, Live Pickup Pass & Kitchen Display System.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EVA Canteen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EVA Canteen — كانتين إيفا</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --eva-splash-bg: #F4F8FF;
      --eva-splash-glow: rgba(13, 71, 161, 0.16);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --eva-splash-bg: #0F172A;
        --eva-splash-glow: rgba(92, 225, 230, 0.18);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--eva-splash-bg);
      overflow: hidden;
    }
    #eva-web-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 50%, var(--eva-splash-glow) 0%, transparent 56%),
        var(--eva-splash-bg);
      opacity: 1;
      transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: auto;
    }
    #eva-web-splash.eva-splash-hiding {
      opacity: 0;
      pointer-events: none;
    }
    #eva-web-splash img {
      width: min(192px, 46vw);
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      animation: evaSplashBreathe 1.4s ease-in-out infinite alternate;
    }
    @keyframes evaSplashBreathe {
      from { transform: scale(0.96); opacity: 0.92; }
      to   { transform: scale(1.03); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #eva-web-splash img { animation: none; }
      #eva-web-splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="eva-web-splash" aria-hidden="true">
    <img src="icons/splash-logo.png" alt="">
  </div>
  <script>
    (function () {
      var dismissed = false;
      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('eva-web-splash');
        if (!el) return;
        el.classList.add('eva-splash-hiding');
        window.setTimeout(function () {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 320);
      }
      window.addEventListener('flutter-first-frame', dismissSplash, { once: true });
      window.setTimeout(dismissSplash, 7000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
