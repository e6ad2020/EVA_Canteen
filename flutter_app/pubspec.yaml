name: eva_canteen
description: "EVA Canteen — Modern Bilingual Digital Ordering, Live Pickup Pass & Kitchen Display System."
publish_to: 'none'
version: 2.0.0+2013

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0
  cupertino_ui: any
  cupertino_icons: ^1.0.8
  equatable: any
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  http: ^1.6.0
  image_picker: ^1.2.4
  fl_chart: ^1.3.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/wallpapers/light_blue/
    - assets/images/wallpapers/light_red/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
